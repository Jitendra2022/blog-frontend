version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline

    build:
      commands:
        - echo "VITE_APP_NAME=$VITE_APP_NAME"
        - echo "VITE_BASE_URL=$VITE_BASE_URL"
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

  cache:
    paths:
      - .npm/**/*